name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests -q

      # 單元測試只能驗「寫下來的是哪一版」。這一步驗那個網址**真的拿得到
      # 檔案**——而那正是漏掉的那一格：cdnjs 的版本清單裡有 2.35.2，但那一版
      # 一個檔案都沒有，網址回 404，而 404 的 <script> 不會報錯，只會讓每一張
      # 圖變成一塊空白。
      #
      # 網址直接跟程式要（`import PLOTLY_CDN`），不是拿 grep 去原始碼裡撈。
      # 撈的那一版上線過一次而且當場失敗：網址在原始碼裡是跨兩個字串常值寫的，
      # grep 撈到空字串，curl 收到空字串就報 Malformed input to a URL function。
      # 一個驗不到東西的檢查比沒有檢查糟——它會綠燈，而它守的東西沒有人在守。
      - name: 確認 plotly 的 CDN 網址拿得到
        run: |
          set -euo pipefail
          for name in PLOTLY_CDN PLOTLY_CDN_FALLBACK; do
            url=$(python -c "from tw_trend_filter.pipeline import $name; print($name)")
            test -n "$url" || { echo "::error::$name 是空的"; exit 1; }
            echo "檢查 $name = $url"
            code=$(curl -sS -o /dev/null -w '%{http_code}' -L "$url")
            size=$(curl -sS -o /dev/null -w '%{size_download}' -L "$url")
            echo "  HTTP $code，$size 位元組"
            test "$code" = "200" || { echo "::error::$name 回 $code"; exit 1; }
            # 整份函式庫是 4 MB 出頭。404 頁面也可能回 200，但它只有幾百位元組。
            test "$size" -gt 1000000 || {
              echo "::error::$name 拿到的不是函式庫（只有 $size 位元組）"; exit 1; }
          done

  # 單元測試證明公式對，這個 job 證明**整條路走得通**：Yahoo 還讓我們抓、
  # ISIN 那張表還是那個格式、Excel 還存得起來、報告還畫得出來。
  #
  # 只掃 40 檔（約一分鐘）。抓不到資料時 40 檔可能一檔都沒通過篩選，那不是
  # 失敗——所以下面只檢查「檔案有沒有生出來」，不檢查「有幾檔通過」。
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 安裝中文字型
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: 掃 40 檔
        run: |
          python -m tw_trend_filter \
            --output-dir output --limit 40 \
            --link-base "https://metallicatw.github.io/tw-six-metrics/stock"
      - name: 確認產出
        run: |
          ls -la output/
          # Excel 一定要有。HTML 只有在真的篩出東西的時候才會有，所以
          # 它不在的時候只是提醒一句，不是失敗。
          test -n "$(ls output/*.xlsx 2>/dev/null)" || { echo "::error::沒有產生 Excel"; exit 1; }
          if [ -z "$(ls output/*.html 2>/dev/null)" ]; then
            echo "::notice::這 40 檔今天沒有標的通過篩選，所以沒有 HTML——這是正常的"
          fi
